[build]
  # Skips docs-only commits; see scripts/netlify-ignore.sh for why the logic
  # lives in a script rather than inline (inline exclude pathspecs silently
  # skip every deploy).
  ignore = "bash scripts/netlify-ignore.sh"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/metsmiserymadness"
  to = "/metsmiserymadness.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The contact file behind "Save contact": phones open text/vcard as "add to contacts".
[[headers]]
  for = "/chirag-shah.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
