[build]
  # Skip the build when a commit touches nothing the site ships (root-level
  # docs, .claude/). Exit 0 = skip, non-zero = build.
  #
  # CACHED_COMMIT_REF must be quoted AND checked: on a build with no warm
  # cache it is empty, and an unquoted empty ref degenerates into a
  # working-tree diff, which is always empty in CI and would silently skip
  # every deploy. Empty => exit 1 so the build always proceeds.
  ignore = '''test -z "$CACHED_COMMIT_REF" && exit 1; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude,glob)*.md' ':(exclude).claude/' '''
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/metsmiserymadness"
  to = "/metsmiserymadness.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
